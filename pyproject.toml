[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ragmechanic"
version = "0.1.0"
description = "A framework for building, evaluating, and diagnosing RAG systems."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"


dependencies = [
    "langchain-core>=1.2,<2.0",
    "langchain>1.2",
    "langchain-community>=0.4,<0.5",
    "langchain-text-splitters>1.0,<2.0",
    "langchain-classic>1.0.1",
    "pypdf>6.0",
    "docx2txt>=0.9",
    "python-pptx",
    "chardet",
    "tiktoken",
    "python-dotenv",
    "dotenv",
    "tqdm",

    "langchain-huggingface>1.0",
    "sentence-transformers>5.2",

    "chromadb",
    "langchain-chroma",

    "faiss-cpu",

    "langchain-google-genai",

    "langchain-xai",

    "langchain-mistralai",

    "langchain-anthropic",
    "langchain-qdrant",

    "langchain-pinecone",
    "deepeval>=4.1.5,<5.0.0",

    "unstructured",
]


[tool.setuptools.packages.find]
where = ["src"]
